apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: my-bootc-vm
  namespace: sensors
  labels:
    app: remote-sensor
spec:
  runStrategy: RerunOnFailure
  dataVolumeTemplates:
    - metadata:
        name: my-bootc-vm-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: remote-sensor-boot
          namespace: sensors
        storage:
          resources:
            requests:
              storage: 20Gi
  template:
    metadata:
      labels:
        app: remote-sensor
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1024M
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
      volumes:
        - name: rootdisk
          dataVolume:
            name: my-bootc-vm-rootdisk
        - name: cloudinitdisk
          cloudInitConfigDrive:
            secretRef:
              name: remote-sensor-cloudinit
