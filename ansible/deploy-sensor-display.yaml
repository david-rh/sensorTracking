---
- name: Deploy sensorDisplay to OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/../sensorDisplay"
    namespace: sensortracking
    truststore_path: "{{ playbook_dir }}/../mykeystore.jks"

  tasks:
    - name: Create Kafka truststore secret
      ansible.builtin.command:
        cmd: >
          oc create secret generic kafka-truststore
          --from-file=mykeystore.jks={{ truststore_path }}
          -n {{ namespace }}
          --dry-run=client -o yaml
      register: truststore_secret
      changed_when: false

    - name: Apply Kafka truststore secret
      ansible.builtin.command:
        cmd: oc apply -f -
        stdin: "{{ truststore_secret.stdout }}"
      changed_when: true

    - name: Apply deployment manifests
      ansible.builtin.command:
        cmd: oc apply -k {{ project_dir }}/deploy
      changed_when: true

    - name: Restart deployment to pick up new image
      ansible.builtin.command:
        cmd: oc rollout restart deployment/sensor-display -n {{ namespace }}
      changed_when: true

    - name: Wait for deployment rollout
      ansible.builtin.command:
        cmd: >
          oc rollout status deployment/sensor-display
          -n {{ namespace }} --timeout=120s
      changed_when: false

    - name: Get route URL
      ansible.builtin.command:
        cmd: >
          oc get route sensor-display
          -n {{ namespace }}
          -o jsonpath='{.spec.host}'
      register: route_host
      changed_when: false

    - name: Display application URL
      ansible.builtin.debug:
        msg: "sensorDisplay available at https://{{ route_host.stdout }}"
