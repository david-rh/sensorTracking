apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  labels:
    strimzi.io/cluster: sensorkafka
  name: david
  namespace: sensortracking
spec:
  authentication:
    type: scram-sha-512
  authorization:
    acls:
    - host: '*'
      operations:
      - Read
      - Describe
      - Write
      - Create
      resource:
        name: my-topic
        patternType: literal
        type: topic
    - host: '*'
      operations:
      - Read
      resource:
        name: my-group
        patternType: literal
        type: group
    type: simple
