<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Sensor Console</title>
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@5/patternfly-base.css" crossorigin="anonymous">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'RedHatText', 'Overpass', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1b1d21; color: #e8eaed;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .masthead {
            height: 48px; background: #151515; border-bottom: 1px solid #3c3f42;
            display: flex; align-items: center; padding: 0 20px; flex-shrink: 0;
        }
        .masthead__title { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
        .masthead__title svg { width: 18px; height: 18px; fill: #73bcf7; margin-right: 8px; vertical-align: middle; }
        .live-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #3e8635;
            margin-left: 12px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

        .main { flex: 1; display: flex; justify-content: center; padding: 32px 20px; }
        .console-card {
            background: #212427; border: 1px solid #3c3f42; border-radius: 8px;
            width: 100%; max-width: 600px; overflow: hidden;
        }
        .card-header {
            padding: 16px 20px; border-bottom: 1px solid #3c3f42;
            display: flex; align-items: center; gap: 10px;
        }
        .card-header__id { font-size: 18px; font-weight: 600; }
        .card-header__badge {
            font-size: 11px; background: #1f4e79; color: #73bcf7;
            padding: 2px 8px; border-radius: 10px; font-weight: 500;
        }
        .card-body { padding: 20px; }

        .section-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 1px; color: #6b7280; margin-bottom: 10px;
        }
        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: #2a2d33; border: 1px solid #3c3f42; border-radius: 6px;
            padding: 10px 12px;
        }
        .stat-card__label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #6b7280; margin-bottom: 4px; }
        .stat-card__value { font-size: 16px; font-weight: 600; font-family: 'RedHatMono', 'SFMono-Regular', monospace; }

        .message-section { margin-top: 20px; }
        .message-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .form-input {
            flex: 1; background: #2a2d33; border: 1px solid #3c3f42; border-radius: 4px;
            color: #e8eaed; padding: 8px 12px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color .15s;
        }
        .form-input:focus { border-color: #73bcf7; }
        .form-input::placeholder { color: #6b7280; }
        .btn {
            padding: 8px 16px; border-radius: 4px; border: none; font-size: 13px;
            font-weight: 600; cursor: pointer; font-family: inherit; transition: background .15s;
        }
        .btn-primary { background: #0066cc; color: #fff; }
        .btn-primary:hover { background: #004d99; }
        .btn-secondary { background: #3c3f42; color: #e8eaed; }
        .btn-secondary:hover { background: #4a4d51; }

        .active-message {
            background: #2a2d33; border: 1px solid #3c3f42; border-left: 3px solid #f0ab00;
            border-radius: 4px; padding: 10px 12px; font-size: 13px; color: #f0ab00;
            font-weight: 500; word-break: break-word; margin-top: 10px;
        }
        .active-message--empty { color: #6b7280; border-left-color: #3c3f42; font-style: italic; }

        .footer-bar {
            height: 36px; background: #151515; border-top: 1px solid #3c3f42;
            display: flex; align-items: center; padding: 0 20px; flex-shrink: 0;
            font-size: 11px; color: #6b7280;
        }
    </style>
</head>
<body>
    <header class="masthead">
        <span class="masthead__title">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
            Remote Sensor Console
        </span>
        <div class="live-dot"></div>
    </header>

    <main class="main">
        <div class="console-card">
            <div class="card-header">
                <span class="card-header__id" id="sensorId">—</span>
                <span class="card-header__badge">PUBLISHING</span>
            </div>
            <div class="card-body">
                <div class="section-title">Position</div>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-card__label">Latitude</div>
                        <div class="stat-card__value" id="lat">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__label">Longitude</div>
                        <div class="stat-card__value" id="lng">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__label">Altitude</div>
                        <div class="stat-card__value" id="alt">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__label">Accuracy</div>
                        <div class="stat-card__value" id="acc">—</div>
                    </div>
                </div>

                <div class="section-title">Motion</div>
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-card__label">Speed (km/h)</div>
                        <div class="stat-card__value" id="speed">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-card__label">Heading</div>
                        <div class="stat-card__value" id="heading">—</div>
                    </div>
                </div>

                <div class="message-section">
                    <div class="section-title">Message</div>
                    <div class="message-input-row">
                        <input type="text" class="form-input" id="messageInput" placeholder="Type a message to display..." maxlength="200">
                        <button class="btn btn-primary" id="sendBtn">Send</button>
                        <button class="btn btn-secondary" id="clearBtn">Clear</button>
                    </div>
                    <div class="active-message active-message--empty" id="activeMessage">No active message</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-bar">
        <span id="footerText">Connecting...</span>
    </footer>

    <script>
        const $ = id => document.getElementById(id);

        function updateDisplay(d) {
            $('sensorId').textContent = d.id;
            $('lat').textContent = d.lat.toFixed(6);
            $('lng').textContent = d.lng.toFixed(6);
            $('alt').textContent = d.alt.toFixed(1) + ' m';
            $('acc').textContent = d.acc.toFixed(1) + ' m';
            $('speed').textContent = d.speed.toFixed(1);
            $('heading').textContent = d.heading.toFixed(1) + '°';
            $('footerText').textContent = 'Last update: ' + new Date().toLocaleTimeString();

            const msgEl = $('activeMessage');
            if (d.message) {
                msgEl.textContent = d.message;
                msgEl.className = 'active-message';
            } else {
                msgEl.textContent = 'No active message';
                msgEl.className = 'active-message active-message--empty';
            }
        }

        async function fetchData() {
            try {
                const res = await fetch('/sensor');
                if (res.ok) updateDisplay(await res.json());
            } catch (e) { /* retry next tick */ }
        }

        async function sendMessage(text) {
            try {
                const res = await fetch('/sensor/message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: text
                });
                if (res.ok) updateDisplay(await res.json());
            } catch (e) { /* ignore */ }
        }

        $('sendBtn').addEventListener('click', () => {
            const val = $('messageInput').value.trim();
            if (val) sendMessage(val);
        });

        $('clearBtn').addEventListener('click', () => {
            $('messageInput').value = '';
            sendMessage('');
        });

        $('messageInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const val = $('messageInput').value.trim();
                if (val) sendMessage(val);
            }
        });

        fetchData();
        setInterval(fetchData, 1000);
    </script>
</body>
</html>
