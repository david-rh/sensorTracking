sensor.id=${SENSOR_ID:sensor-1}
sensor.start.lat=${SENSOR_START_LAT:38.8977}
sensor.start.lng=${SENSOR_START_LNG:-77.0365}

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
%dev.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka-bootstrap.example.com:443}
%dev.quarkus.http.port=8081
mp.messaging.outgoing.sensor-data.topic=sensor-data
mp.messaging.outgoing.sensor-data.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
kafka.security.protocol = ${KAFKA_SECURITY_PROTOCOL:SSL}
kafka.ssl.truststore.location = ${KAFKA_SSL_TRUSTSTORE_LOCATION:mykeystore.jks}
kafka.ssl.truststore.password = ${KAFKA_SSL_TRUSTSTORE_PASSWORD:changeit}
